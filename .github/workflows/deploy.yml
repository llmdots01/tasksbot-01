name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN   – token with Workers Scripts, Pages and D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account id
# Optional repository variable:
#   VITE_API_URL           – defaults to the production Worker URL below

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  api:
    name: Worker API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tasksbot-db --remote
      - name: Deploy Worker
        run: npx wrangler deploy

  web:
    name: Pages frontend
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://tasksbot-api.tasksbot01.workers.dev' }}
      - name: Deploy to Pages
        run: npx wrangler pages deploy dist --project-name tasksbot --branch main --commit-hash ${{ github.sha }}
